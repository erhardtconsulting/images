name: "Init-Postgres 18: Build Container Image / Pull Request"

on:
  pull_request:
    branches:
      - main
    paths:
      - 'init-postgres/pg18.Dockerfile'
      - 'init-postgres/root/**'
      - '.github/workflows/build-container.yml'
      - '.github/workflows/build-init-postgres-18-pr.yml'

permissions:
  contents: read
  packages: write

jobs:
  get-version:
    runs-on: ubuntu-26.04
    outputs:
      postgresql: ${{ steps.postgresql_version.outputs.POSTGRESQL_VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get PostgreSQL version
        id: postgresql_version
        run: |
          echo "POSTGRESQL_VERSION=$(./get-apt-version.sh http://apt.postgresql.org trixie-pgdg postgresql-client-18 | sed -E 's/^([0-9]+\.[0-9]+).*$/\1/')" >> $GITHUB_OUTPUT

  call-build-workflow:
    name: Build
    needs: get-version
    uses: erhardtconsulting/images/.github/workflows/build-container.yml@f338b1f5f3406c1f6dda74af6b8e8b40123983c1 # main
    with:
      image: "init-postgres"
      dockerfile: "pg18.Dockerfile"
      tag: ${{ needs.get-version.outputs.postgresql }}
      push: false
      push-docker: false
      push-quay: false
      use-swap: true
    secrets: inherit
